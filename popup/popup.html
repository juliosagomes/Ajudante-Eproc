<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajudante Eproc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">

    <header class="popup-header">
      <svg class="popup-header__logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="20" cy="20" r="16" fill="#7ab3d8" opacity="0.85"/>
        <circle cx="32" cy="22" r="11" fill="#4a8fc4" opacity="0.75"/>
        <circle cx="26" cy="33" r="9" fill="#2d6fa8" opacity="0.80"/>
        <path d="M14 20 L18.5 25 L27 15" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="popup-header__brand">
        <span class="popup-header__title">Ajudante Eproc</span>
      </div>
      <button class="popup-header__config" id="btn-config" title="Abrir configurações">
        <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="popup-accordion" id="popup-accordion"></div>

    <div class="popup-empty" id="popup-empty" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" width="32" height="32"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm0 6v4l3 2" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p>Nenhum módulo ativo.</p>
      <button class="popup-btn popup-btn--secondary" id="btn-config-empty">
        Abrir configurações
      </button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
